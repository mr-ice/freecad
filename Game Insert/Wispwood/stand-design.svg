<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" font-family="Helvetica, Arial, sans-serif">
  <style>
    .tray   { fill:#cfe0ff; stroke:#3a66c4; stroke-width:2; opacity:0.85; }
    .base   { fill:#cdeee0; stroke:#1a8a63; stroke-width:2; }
    .shelf  { stroke:#9a7b35; stroke-width:9; stroke-linecap:round; fill:none; }
    .leg    { stroke:#c9772a; stroke-width:7; stroke-linecap:round; }
    .table  { stroke:#444; stroke-width:3; }
    .plumb  { stroke:#d12; stroke-width:1.4; stroke-dasharray:5 4; }
    .plumb2 { stroke:#e58; stroke-width:1.4; stroke-dasharray:3 4; }
    .cg     { fill:#d12; } .cg2 { fill:#e58; }
    .hinge  { fill:#fff; stroke:#222; stroke-width:1.6; }
    .dim    { stroke:#777; stroke-width:1; } .dimt{ font-size:11px; fill:#555; }
    .ttl    { font-size:16px; font-weight:bold; }
    .lbl    { font-size:12px; fill:#222; }
    .good   { fill:#178a3a; font-size:12px; font-weight:bold; }
  </style>

  <text x="20" y="26" class="ttl">Chosen design B — tabletop base, 75°, tray bottom lifted 25 mm (side view, to scale)</text>

  <!-- table -->
  <line class="table" x1="60" y1="430" x2="700" y2="430"/>
  <text x="640" y="448" class="dimt">table</text>

  <!-- base frame (flat on table): forward foot at x110 .. cradle/back x253 -->
  <rect class="base" x="110" y="419" width="143" height="11"/>
  <text x="150" y="414" class="lbl" fill="#1a8a63">base frame (sole table contact — flat &amp; wide → no rock)</text>

  <!-- shelf (leaning rod) from hinge up-back -->
  <line class="shelf" x1="150" y1="424" x2="235" y2="107"/>
  <!-- tray slab on shelf front face -->
  <polygon class="tray" points="159,390 235,107 169,89 93,372"/>
  <text x="240" y="120" class="lbl" fill="#3a66c4">tray (leans 75°)</text>
  <text x="40" y="360" class="lbl" fill="#3a66c4">lip + pegs</text>
  <text x="40" y="374" class="lbl" fill="#3a66c4">+ tabs (kept)</text>

  <!-- prop leg + cradle -->
  <line class="leg" x1="165" y1="388" x2="234" y2="419"/>
  <circle class="hinge" cx="165" cy="388" r="4.5"/>
  <circle class="hinge" cx="234" cy="419" r="4.5"/>
  <text x="238" y="416" class="lbl" fill="#c9772a">snap cradle</text>
  <text x="120" y="300" class="lbl" fill="#c9772a">fold-out</text>
  <text x="120" y="314" class="lbl" fill="#c9772a">prop leg</text>

  <!-- shelf-base hinge -->
  <circle class="hinge" cx="150" cy="424" r="5"/>
  <text x="120" y="445" class="lbl">hinge</text>

  <!-- CG empty (164,239) and loaded-low (133,353) -->
  <line class="plumb"  x1="164" y1="239" x2="164" y2="430"/>
  <circle class="cg"  cx="164" cy="239" r="6"/>
  <text x="172" y="236" class="lbl" fill="#d12">CG empty (9 mm behind hinge)</text>
  <line class="plumb2" x1="133" y1="353" x2="133" y2="430"/>
  <circle class="cg2" cx="133" cy="353" r="6"/>
  <text x="6" y="338" class="lbl" fill="#e58">CG loaded-low</text>
  <text x="6" y="352" class="lbl" fill="#e58">(10 mm fwd of hinge)</text>

  <!-- both plumbs land between base front(110) and cradle(234): show footprint -->
  <line class="dim" x1="110" y1="462" x2="253" y2="462"/>
  <line class="dim" x1="110" y1="457" x2="110" y2="467"/>
  <line class="dim" x1="253" y1="457" x2="253" y2="467"/>
  <text x="118" y="478" class="good">both CG plumbs land inside the base footprint → stable</text>

  <!-- lift dim: table(430) to lip(~390) = 25 mm -->
  <line class="dim" x1="78" y1="430" x2="78" y2="390"/>
  <line class="dim" x1="73" y1="430" x2="83" y2="430"/>
  <line class="dim" x1="73" y1="390" x2="83" y2="390"/>
  <text x="20" y="414" class="dimt">25 mm</text>
  <text x="14" y="402" class="dimt">lift</text>

  <!-- forward foot dim: x110..x150 -->
  <line class="dim" x1="110" y1="405" x2="150" y2="405"/>
  <text x="96" y="400" class="dimt">~25 mm forward foot</text>

  <!-- folded inset -->
  <g transform="translate(470,150)">
    <text x="0" y="-10" class="ttl" font-size="13">folded for storage</text>
    <rect class="base"  x="0" y="60" width="210" height="10"/>
    <rect class="shelf" x="0" y="50" width="210" height="9" fill="#e7d7b8" stroke="none"/>
    <rect x="20" y="42" width="150" height="8" fill="#f0dcc0" stroke="#c9772a" stroke-width="1.5"/>
    <rect x="60" y="20" width="14" height="22" class="tray"/>
    <text x="80" y="36" class="dimt">lip stands up (~tallest part)</text>
    <text x="0" y="92" class="dimt">base + shelf + leg stack flat — folded height ≈ 37 mm (&lt; 40 mm bay limit)</text>
    <text x="0" y="108" class="dimt">forward foot protrudes past the shelf bottom edge</text>
  </g>
</svg>
