<svg xmlns="http://www.w3.org/2000/svg" width="185mm" height="265mm"
     viewBox="0 0 185 265" font-family="Helvetica, Arial, sans-serif">
  <!-- Wispwood box floor map: 185 x 265 mm, to scale (1 unit = 1 mm).
       Bottom layer shown; top-layer items listed in the corner note. -->
  <style>
    .region { stroke:#333; stroke-width:0.6; }
    .well   { fill:none; stroke:#666; stroke-width:0.4; stroke-dasharray:2 1.5; }
    .lbl    { font-size:5px; fill:#111; text-anchor:middle; }
    .sub    { font-size:3.2px; fill:#444; text-anchor:middle; }
    .note   { font-size:3.6px; fill:#222; }
    .dim    { font-size:3px; fill:#888; text-anchor:middle; }
  </style>

  <!-- box outline -->
  <rect x="0" y="0" width="185" height="265" fill="#ffffff" stroke="#000" stroke-width="1"/>

  <!-- Wispwood tray -->
  <rect class="region" x="0" y="0" width="182.6" height="86" fill="#cfe3f7"/>
  <text class="lbl" x="91.3" y="40">Wispwood tray</text>
  <text class="sub" x="91.3" y="47">tiles + 2-part sliding lid  (86 × 182.6)</text>

  <!-- folded alt stand bay -->
  <rect class="region" x="0" y="88" width="94" height="107" fill="#d6f0d8"/>
  <text class="lbl" x="47" y="138">Folded alt stand</text>
  <text class="sub" x="47" y="145">~92 × 105</text>

  <!-- small components tray -->
  <rect class="region" x="98" y="88" width="87" height="177" fill="#f3eddb"/>

  <!-- card deck well -->
  <rect class="well" x="101" y="92" width="63" height="88"/>
  <text class="lbl" x="132.5" y="134">Card deck</text>
  <text class="sub" x="132.5" y="141">63 × 88</text>

  <!-- cats on edge -->
  <rect class="well" x="101" y="186" width="35" height="32"/>
  <text class="sub" x="118.5" y="200">Cats ×6</text>
  <text class="sub" x="118.5" y="205">(on edge)</text>

  <!-- round tokens -->
  <circle class="well" cx="155" cy="225" r="17.5"/>
  <text class="sub" x="155" y="224">Round</text>
  <text class="sub" x="155" y="229">tokens ×8</text>

  <!-- top-layer note, in the spare corner -->
  <rect x="3" y="200" width="88" height="60" fill="none" stroke="#bbb" stroke-width="0.4" stroke-dasharray="1.5 1.5"/>
  <text class="note" x="6" y="210">ON TOP (top tray + loose):</text>
  <text class="note" x="6" y="217">• board pieces ×5 (octagon + 4)</text>
  <text class="note" x="6" y="224">• markers ×4  (34 × 214)</text>
  <text class="note" x="6" y="231">• 1st-player paw  (70 × 64)</text>
  <text class="note" x="6" y="238">• score pad  (103 × 218)</text>
  <text class="note" x="6" y="245">• rules booklet  (170 × 244)</text>

  <!-- overall dims -->
  <text class="dim" x="92.5" y="262">185 mm</text>
  <text class="dim" x="181" y="133" transform="rotate(90 181 133)">265 mm</text>
</svg>
